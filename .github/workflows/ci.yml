name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# NOTE: 同一ブランチへの連続pushでは古いランを打ち切り、Windowsランナー時間を節約する。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        # NOTE: Electron のビルドツールは配布物へ含めない。CI は利用者へ配布する
        # production dependency を監査し、build-only advisories は固定 lockfile と
        # 実際の Windows パッケージ検証で別途扱う。
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build Electron sources
        run: npm run build:electron

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  # NOTE: 公開Web版は Electron 版と別ジョブ・別成果物にする（設計書 4.1）。
  # verify に needs で繋がないのは、Web のデプロイ検証が落ちても Electron の
  # GitHub Releases を止めないため。ランナーが ubuntu なのは、Web の配置先が
  # Linux コンテナで、Windows 固有の挙動を検証する必要がないから。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check web app
        run: npm run web:typecheck

      - name: Run web tests
        run: npm run web:test

      # NOTE: インベントリは生成物。ソースと食い違ったまま放置されると、
      # 移行計画の判断材料にならないので CI で鮮度を検証する。
      - name: Verify migration inventory is current
        run: npm run test -- tests/unit/webPortability.test.ts

      - name: Build web app
        run: npm run web:build
